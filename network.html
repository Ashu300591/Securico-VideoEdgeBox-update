<script>



async function loadstoageconsumed()

    {

        const response = await fetch('/api/getstorage');

        const data = await response.json();



        document.getElementById("storageused").innerText = data.used+"GB of "+data.total_space+"GB";

    }

    

    loadstoageconsumed();



    async function loadNetworkInfo()

    {

        const response = await fetch('/api/network');

        const data = await response.json();



        var defaultgateway=data.gateway



        document.getElementById("currentIp").innerText = data.ip;

        // document.getElementById("mac").innerText = data.mac;

        document.getElementById("ip").value = data.ip;

        // document.getElementById("macid").value = data.mac;

        document.getElementById("subnet").value = data.subnet;

        document.getElementById("gateway").value = data.gateway;

        

    }

    

    loadNetworkInfo();

 

    async function getmacid() {

        try {

            const response = await fetch('/api/getmacid');



            if (!response.ok) {

                throw new Error("API request failed");

            }



            const data = await response.json();



            console.log("MAC received:", data.mac);



            const macText = document.getElementById("mac");

            const macInput = document.getElementById("macid");



            if (macText) {

                macText.innerText = data.mac;

            }



            if (macInput) {

                macInput.value = data.mac;

            }



        } catch (error) {

            console.error("MAC address error:", error);

        }

    }



    document.addEventListener("DOMContentLoaded", function () {

        getmacid();

    });



    async function getpanelid()

    {

        const response = await fetch('/api/getpanelid');

        const data = await response.json();



        var pid=data[0]

        pid=pid['panelid']



        document.getElementById("panelid").innerText = pid;

        

    }

    

    getpanelid();



    function rebootPi() {

        if (confirm("Reboot Video Edge Box?")){

            fetch('/reboot', {

                method: 'POST'

            })

            .then(response => response.json())

            .then(data => {

                alert(data.message);

            })

            .catch(error => {

                alert("Failed to reboot device");

                console.error(error);

            });

        }   

    }



    function shutdownPi(){

        if (confirm("Shutdown Video Edge Box?")){

            fetch('/shutdown', {

                method: 'POST'

            })

            .then(response => response.json())

            .then(data => {

                alert(data.message);

            })

            .catch(error => {

                alert("Failed to reboot device");

                console.error(error);

            });

        }        

    }



    async function saveNetworkConfig() {



        const ip = document.getElementById("ip").value.trim();



        // Check for alphabets or special characters

        if (!/^[0-9.]+$/.test(ip)) {

            alert("IP Address can contain only numbers and dots.");

            document.getElementById("ip").focus();

            return;

        }



        // Check valid IPv4 format

        const parts = ip.split(".");

        

        if (parts.length !== 4) {

            alert("Please enter a valid IP Address.\nExample: 192.168.1.100");

            document.getElementById("ip").focus();

            return;

        }



    for (let part of parts) {



        // Each part must contain numbers

        if (!/^\d+$/.test(part)) {

            alert("Invalid IP Address.");

            document.getElementById("ip").focus();

            return;

        }



        // Each section must be 0-255

        const number = Number(part);



        if (number < 0 || number > 255) {

            alert("Each IP section must be between 0 and 255.");

            document.getElementById("ip").focus();

            return;

        }

    }





        const payload = {

            // hostname: document.getElementById("hostname").value,

            // dhcp: document.getElementById("dhcp").value,

            ip: document.getElementById("ip").value,

            subnet: document.getElementById("subnet").value,

            gateway: document.getElementById("gateway").value,

            dns1: document.getElementById("dns1").value,

            dns2: document.getElementById("dns2").value

        };



        try {

            const response = await fetch('/api/setnetwork', {

                method: 'POST',

                headers: {

                    'Content-Type': 'application/json'

                },

                body: JSON.stringify(payload)

            });

        

            const result = await response.json();

        

            if(result.status === "success"){

                // alert("Network configuration saved successfully");

                const answer = confirm("Network configuration saved successfully. Press OK to continue");



                //if (answer) {

                //    try {

//

                //        const response = await fetch("/reboot", {

                //            method: "POST",

                //            headers: {

                //                "Content-Type": "application/json"

                //            }

                //        });

//

                //        const result = await response.json();

//

                //    if (response.ok) {

                //        alert(result.message);

                //    } else {

                //        alert(result.message || "Reboot failed.");

                //    }

//

                //    } catch (error) {

                //    

                //        console.error("Reboot error:", error);

                //        alert("Unable to reboot Raspberry Pi.");

                //    

                //    }

                //} else {

                //    console.log("Cancel pressed");

                //}

            }else {

                // alert(result.status);

                const answer = confirm(result.status);

                if (answer) {

                    try {

                        const response = await fetch("/reboot", {

                            method: "POST",

                            headers: {

                                "Content-Type": "application/json"

                            }

                        });

                        const result = await response.json();

                    if (response.ok) {

                        alert(result.message);

                    } else {

                        alert(result.message || "Reboot failed.");

                    }



                    } catch (error) {

                        console.error("Reboot error:", error);

                        alert("Unable to reboot Raspberry Pi.");

                    

                    }

                } else {

                    console.log("Cancel pressed");

                }

            }

        } catch(err) {

            alert("Updated Successfully.");

            console.error(err);

        }

    }

    async function savedvrConfig(){

        dvrip= document.getElementById("dvrip").value,

        dvrrtspport= document.getElementById("dvrrtspport").value,

        dvrusername= document.getElementById("dvrusername").value,

        dvrpassword= document.getElementById("dvrpassword").value,

        fetch('/update_dvrsettings',{

            method:'POST',

            headers:{

                'Content-Type':'application/json'

            },

            body:JSON.stringify({

                dvrip:dvrip,

                dvrrtspport:dvrrtspport,

                dvrusername:dvrusername,

                dvrpassword:dvrpassword

            })

        })

        .then(response => response.json())

        .then(data =>{

            alert(data.message)

        })

        .catch(err=>{

            console.log(err)

            alert('Failed to update configuration.')

        })

    }

    async function savedeviceNetworkConfig(){

        license= document.getElementById("license").value,

        listenerPort= document.getElementById("listenerPort").value

        webaccessport= document.getElementById("webaccessport").value   

        currentIp= document.getElementById("ip").value   

        fetch('/update_env',{

            method:'POST',

            headers:{

                'Content-Type':'application/json'

            },

            body:JSON.stringify({

                LICENSE_NUMBER:license,

                LISTENER_PORT:listenerPort,

                DASHBOARD_PORT:webaccessport,

                FLASK_HOST:currentIp

            })

        })

        .then(response => response.json())

        .then(data =>{

            alert(data.message)

        })

        .catch(err=>{

            console.log(err)

            alert('Failed to update configuration.')

        })

    }

    async function loadDeviceNetworkConfig() {

    fetch('/get_env')

        .then(response => response.json())

        .then(data => {

            if (data.success) {

                console.log(data)

                //document.getElementById("license").value = data.LICENSE_NUMBER;

                document.getElementById("listenerPort").value = data.LISTENER_PORT;

                document.getElementById("webaccessport").value = data.FLASK_PORT;

                document.getElementById("ip").value = data.FLASK_HOST;

                document.getElementById("dvrip").value = data.DVRIP;

                document.getElementById("dvrrtspport").value = data.DVRRTSPPORTNO;

                document.getElementById("dvrusername").value = data.DVRUSERNAME;

                document.getElementById("dvrpassword").value = data.DVRPASSWORD;

            } else {

                alert(data.message);

            }

        })

        .catch(err => {
            console.log(err);
        });

    }

    loadDeviceNetworkConfig();

    async function openVideoEdge(){

    try{

        const response=await fetch('/api/videoedgeconfig');

        const config=await response.json()

        window.open(

            `http://${config.ip}:${config.port}`,

            '_blank'

        )

    }catch(err){

        alert('Unable to Open the Page at this Time.')

        console.log(err)

    }

}
